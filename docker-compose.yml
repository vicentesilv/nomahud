services:
  frontend:
    build:
      context: ./frontend
      target: development
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: development
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
    networks:
      - app-network
    depends_on:
      - app

  app:
    build:
      context: ./backend
      target: development
    container_name: nestjs-app
    restart: unless-stopped
    command: sh -c "npm ci && npm run start:dev"
    ports:
      - '3001:3000'
    environment:
      NODE_ENV: development
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD?DB_PASSWORD is required}
      DB_NAME: ${DB_NAME?DB_NAME is required}
    volumes:
      - ./backend:/usr/src/app
      - backend-node-modules:/usr/src/app/node_modules
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - app-network

  mysql:
    image: mysql:8.0
    container_name: mysql-db
    restart: unless-stopped
    ports:
      - '3308:3306'
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD?DB_PASSWORD is required}
      MYSQL_DATABASE: ${DB_NAME?DB_NAME is required}
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s

volumes:
  mysql-data:
  frontend-node-modules:
  backend-node-modules:

networks:
  app-network:
    driver: bridge
